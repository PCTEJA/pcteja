name: Refresh profile visuals

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build 3D contribution skylines
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Animate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#a78bfa&color_dots=#161e35,#153d59,#176b82,#22b6c7,#67e8f9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render GitHub stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0b1020&title_color=67e8f9&text_color=cbd5e1&icon_color=a78bfa&ring_color=67e8f9&border_radius=18&include_all_commits=false&custom_title=The%20GitHub%20Telemetry
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Render language donut
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=6&hide_border=true&bg_color=0b1020&title_color=67e8f9&text_color=cbd5e1&border_radius=18&custom_title=The%20Language%20Mix
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Render activity and streak cards
        run: python3 scripts/render_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Publish generated SVGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/*.svg profile-3d-contrib/*.svg
          if git diff --cached --quiet; then
            echo 'Profile visuals are already current.'
          else
            git commit -m 'Refresh contribution skyline and profile charts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
